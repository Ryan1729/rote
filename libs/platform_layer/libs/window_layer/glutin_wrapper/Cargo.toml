[package]
name = "glutin_wrapper"
version = "0.1.0"
authors = ["Ryan1729 <Ryan1729@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Maybe newest without api changes?
glutin_0_29 = { package = "glutin", version = "0.29.1", optional = true }
# latest as of 2026-10-05
glutin_0_32 = { package = "glutin", version = "0.32.3", optional = true }
# Only needed/available for new enough glutin versions
glutin-winit = { package = "glutin-winit", version = "0.5.0", optional = true }
# Attempted to match what is used in glutin-winit
winit = { package = "winit", version = "0.30.13", optional = true }
# For the moment, putting this here seems best to get the glutin_0_32 version working
gl33 = { version = "0.2.1", optional = true }


[features]
default = []
glutin-0-32 = ["dep:glutin_0_32", "dep:glutin-winit", "dep:winit", "dep:gl33"]
glutin-0-29 = ["dep:glutin_0_29"]