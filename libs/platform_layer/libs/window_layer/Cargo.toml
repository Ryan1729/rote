[package]
name = "window_layer"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/window_layer.rs"

[dependencies]
c_platform = { path = "c_platform", optional=true }
gl_layer = { path = "gl_layer", optional=true }
glutin_wrapper = { path = "glutin_wrapper", optional=true }
platform_layer_types = { path = "../platform_layer_types" }
window_layer_types = { path = "../window_layer_types" }
perf_viz = { path = "../../../perf_viz" }
screen_space = { path = "../../../screen_space" }
spin_sleep_util = "0"

[dev-dependencies]
# for some of the examples
platform_types = { path = "../../../platform_types" }

[features]
default = ["c-dummy-window-layer"]#["glutin-window-layer"]#["dummy-window-layer"]#
glutin-window-layer = ["gl_layer", "glutin_wrapper"]
dummy-window-layer = []
c-dummy-window-layer = ["c_platform"]
invariant-checking = ["gl_layer/invariant-checking"]
no-spinning-sleep = []
time-render = ["gl_layer/time-render"]

