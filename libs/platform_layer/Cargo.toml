[package]
name = "platform_layer"
version = "0.0.1"
authors = ["Ryan1729 <Ryan1729@gmail.com>"]
edition = "2021"
description = "platform layer(s) for rote"
license = "Apache-2.0"

[dependencies]
atomically = { path = "./libs/atomically" }
edited_storage = { path = "./libs/edited_storage" }
macros = { path = "../macros" }
platform_types = { path = "../platform_types" }
shared = { path = "./libs/shared" }
wimp = { path = "./libs/wimp" }
wimp_types = { path = "./libs/wimp_types" }
window_layer = { path = "./libs/window_layer" }
window_layer_types = { path = "./libs/window_layer_types" }
directories = "2.0"

[features]
default = []
disable-fade-alpha = ["wimp/disable-fade-alpha"]
no-spinning-sleep = ["wimp/no-spinning-sleep"]
skip-updating-editor-thread = ["wimp/skip-updating-editor-thread"]
invariant-checking = ["wimp/invariant-checking"]
time-render = ["wimp/time-render"]
extra-prints = ["wimp/extra-prints"]
print-raw-input = ["wimp/print-raw-input"]
native-file-chooser = ["wimp/native-file-chooser"]
